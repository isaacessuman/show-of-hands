[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

[rpc_endpoints]
bsc = "${BSC_RPC_URL}"

[fmt]
line_length = 110
